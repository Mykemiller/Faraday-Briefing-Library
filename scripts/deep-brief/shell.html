<title>The Power Reckoning</title>
<meta name="description" content="Faraday Briefing Library, Deep-tier template sample (BL-08). Draft, not for distribution.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Spectral:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap">
<style>
/* Layout: one reading column, each brief part a printed page; forest-over-gold double rules (Brand Bible §06). */
:root{
  --paper:#FBFAF6; --ink:#1E2622; --muted:#5B6660; --line:#D9DCD3;
  --forest:#1F4A36; --gold:#B08A2E; --cream:#F6EEDC; --cream-ink:#2A2A22;
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-util:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141A17; --ink:#E6E8E2; --muted:#A3ADA6; --line:#33403A;
  --forest:#7DB89A; --gold:#D6B25E; --cream:#262418; --cream-ink:#EFE7D2; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141A17; --ink:#E6E8E2; --muted:#A3ADA6; --line:#33403A;
  --forest:#7DB89A; --gold:#D6B25E; --cream:#262418; --cream-ink:#EFE7D2; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--f-body);}
main{max-width:46rem;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:2.5rem 4rem}
a{color:var(--forest);text-underline-offset:2px}
a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;color:var(--ink)}
.eyebrow,.num,th,.tbl td:last-child,.meta li strong,.refs-json summary,.status{font-family:var(--f-util)}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;color:var(--forest);margin:0}
.cover{display:flex;flex-direction:column;gap:1.25rem;padding-block:2rem 3rem;border-bottom:3px double var(--gold)}
.cover h1{font-size:clamp(2.6rem,7vw,4.2rem);line-height:1.02;margin:0;font-weight:700;letter-spacing:-.01em}
.standfirst{font-family:var(--f-display);font-style:italic;font-size:1.3rem;line-height:1.45;margin:0;max-width:36rem;color:var(--muted)}
ul.meta{list-style:none;padding:0;margin:0;display:grid;gap:.4rem;border-top:1px solid var(--line);padding-top:1rem;font-size:.95rem}
ul.meta li strong{font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--forest);margin-right:.35rem}
.part{padding-top:2.5rem}
.rule{height:6px;border-top:2px solid var(--forest);border-bottom:2px solid var(--gold);margin-bottom:1.5rem}
h2{font-size:1.75rem;line-height:1.15;margin:0 0 .6rem;font-weight:700;display:flex;gap:.7rem;align-items:baseline}
.num{font-size:.9rem;font-weight:600;color:var(--gold);letter-spacing:.06em}
.deck{font-family:var(--f-display);font-style:italic;font-size:1.12rem;color:var(--muted);margin:0 0 1.2rem;border-left:2px solid var(--gold);padding-left:.8rem}
p{margin:0 0 1rem;max-width:65ch}
ul,ol{padding-left:1.3rem;margin:0 0 1rem;display:grid;gap:.45rem;max-width:65ch}
li{break-inside:avoid}
a.ref{font-family:var(--f-util);font-size:.68em;font-weight:600;vertical-align:super;line-height:0;text-decoration:none;color:var(--gold);padding:0 .08em}
.tbl{overflow-x:auto;margin:0 0 1.2rem;break-inside:avoid}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--forest);border-bottom:2px solid var(--forest);padding:.4rem .5rem}
td{border-bottom:1px solid var(--line);padding:.42rem .5rem;vertical-align:top}
#sources-methodology table{font-size:.78rem} #sources-methodology td{word-break:break-word}
#sources-methodology p{font-size:.9rem}
.take-page{padding-top:2.5rem}
.take{background:var(--cream);color:var(--cream-ink);border-left:10px double var(--forest);box-shadow:inset 3px 0 0 var(--gold);padding:1.8rem 2rem;break-inside:avoid}
.take h2{color:var(--cream-ink)}
.take p{font-family:var(--f-display);font-style:italic;font-size:1.12rem;line-height:1.6}
.take .sig{font-style:normal;font-family:var(--f-util);font-size:.85rem;letter-spacing:.04em;color:var(--forest);margin-top:1rem}
code{font-size:.85em}
.refs-json{margin-top:1rem;font-size:.82rem}
.refs-json summary{cursor:pointer;color:var(--forest)}
.refs-json pre{overflow-x:auto;background:var(--cream);color:var(--cream-ink);padding:1rem;font-size:.75rem}
@media (max-width:480px){h2{font-size:1.4rem}.take{padding:1.2rem}}
@page{size:Letter;margin:0.75in}
@media print{
  :root{--paper:#fff;--ink:#1E2622;--muted:#4E5852;--line:#D3D6CD;--forest:#1F4A36;--gold:#A9822A;--cream:#F6EEDC;--cream-ink:#2A2A22}
  html{font-size:9.2pt}
  body{font-size:10.25pt;line-height:1.45}
  p,ul,ol{max-width:none}
  main{max-width:none;padding:0}
  .cover{min-height:8.4in;justify-content:center;border-bottom:0}
  .part{break-before:page;padding-top:0}
  .refs-json{display:none}
  a{color:inherit;text-decoration:none}
  a.ref{color:var(--gold)}
}
</style>
